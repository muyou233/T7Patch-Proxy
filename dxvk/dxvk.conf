# DXVK 配置 —— 现在由 T7Patch 的链式代理带起来（d3d11.dll = 我们的代理，
# d3d11_backend.dll = DXVK 的 d3d11.dll）。
#
# ⚠️ 本次用的是 upstream DXVK 3.1.1 的 x64 构建。原来 conf 里的
#    dxvk.enableAsync / dxvk.gplAsyncCache 两行属于 dxvk-gplasync 分支，
#    upstream 不认识（会记一条 unknown option），已移除以免干扰。
#
# 想对比帧数时先动这两行：
#   tearFree: True  = 关 Vsync 时用 mailbox 呈现模式（不撕裂）
#             False = 开 Vsync 时用 relaxed fifo（允许撕裂，帧数偏低时更少卡顿）
#             Auto  = 交给 DXVK 判断（默认）

dxvk.numCompilerThreads=0
dxgi.maxFrameRate=0
dxgi.maxFrameLatency=1
dxvk.tearFree=Auto

# HUD：屏幕上直接显示 fps / 帧时间 / GPU 占用 —— 判断 DXVK 到底有没有在跑用得上
dxvk.hud=fps,frametimes,gpuload
